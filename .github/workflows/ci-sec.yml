name: CI - Spring Boot DevSecOps

on:
  push:
    branches: [ 'feature/**', 'bugfix/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build/Test, CodeQL, Semgrep, SpotBugs, SCA (SBOM + Trivy) y Quality Gate.
  # OWASP Dependency-Check se ejecuta en el nightly (descarga NVD costosa).
  security:
    name: Security
    uses: ./.github/workflows/security-pipeline.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      dependency-check: false
