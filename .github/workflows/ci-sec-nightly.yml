name: CI - Nightly - Spring Boot DevSecOps

on:
  schedule:
    - cron: '55 20 * * *'  # Runs every day at 20:55
      timezone: 'America/La_Paz'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pipeline completo + SCA con OWASP Dependency-Check (requiere secreto NVD_API_KEY).
  security:
    name: Security
    uses: ./.github/workflows/security-pipeline.yml
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      dependency-check: true
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
